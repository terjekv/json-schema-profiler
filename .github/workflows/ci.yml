name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.90.0"
      - run: cargo test --lib --tests --locked
      - run: cargo test --doc --locked
      - run: cargo test --test validation --locked --features jsonschema/resolve-file
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - name: Install benchmark test runner
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
          cargo install gungraun-runner --version 0.19.4 --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo test --doc --locked
      - run: npx --yes markdownlint-cli2@0.23.3 --config .markdownlint.json "**/*.md" "!target"
