name: Benchmarks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: benchmarks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    uses: terjekv/rust-pr-bench/.github/workflows/rust-pr-bench.yml@d0202becabbd115351a879c21f53ab9da6812a44 # v1.3.0
    with:
      backend: all
      auto_discover: true
      toolchain: stable
      cargo_args: --locked
      criterion_statistic: median
      criterion_cli_args: --noplot --sample-size 40 --warm-up-time 1 --measurement-time 3
      regression_threshold_pct_gungraun: 3
      regression_threshold_pct_criterion: 15
      fail_on_regression: true
      comment_mode: always
      cache_namespace: json-schema-profiler-v1
